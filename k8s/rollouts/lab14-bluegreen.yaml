apiVersion: v1
kind: Service
metadata:
  name: lab14-bluegreen
  namespace: lab14
spec:
  selector:
    app: lab14-bluegreen
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: lab14-bluegreen-preview
  namespace: lab14
spec:
  selector:
    app: lab14-bluegreen
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: lab14-bluegreen
  namespace: lab14
spec:
  replicas: 4
  selector:
    matchLabels:
      app: lab14-bluegreen
  template:
    metadata:
      labels:
        app: lab14-bluegreen
    spec:
      containers:
        - name: app
          image: argoproj/rollouts-demo:blue
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
  strategy:
    blueGreen:
      activeService: lab14-bluegreen
      previewService: lab14-bluegreen-preview
      autoPromotionEnabled: false
