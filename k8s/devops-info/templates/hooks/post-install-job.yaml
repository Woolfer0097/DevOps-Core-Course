{{- if and .Values.hooks.enabled .Values.hooks.postInstall.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: "{{ include "devops-info.fullname" . }}-post-install"
  labels:
    {{- include "devops-info.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install
    "helm.sh/hook-weight": "{{ .Values.hooks.postInstall.weight }}"
    "helm.sh/hook-delete-policy": "{{ .Values.hooks.deletePolicy }}"
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 30
  template:
    metadata:
      name: "{{ include "devops-info.fullname" . }}-post-install"
      labels:
        {{- include "devops-info.selectorLabels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      containers:
        - name: post-install
          image: {{ .Values.hooks.image }}
          command:
            - /bin/sh
            - -c
            - {{ .Values.hooks.postInstall.command | quote }}
{{- end }}
