---
# Application
app_name: devops-app
docker_image: your_dockerhub_username/devops-info-service
docker_tag: latest
app_port: 8000
app_internal_port: 8000
app_env: {}

# Docker Compose
docker_compose_version: "3.8"
compose_project_dir: "/opt/{{ app_name }}"

dockerhub_username: ""
dockerhub_password: ""

# Wipe Logic Control
web_app_wipe: false