---
- name: Include wipe tasks
  ansible.builtin.include_tasks: wipe.yml
  # Wipe tasks are double-gated:
  # - must set `web_app_wipe=true` (when condition in wipe.yml)
  # - optionally run with `--tags web_app_wipe` for wipe-only
  tags:
    - web_app_wipe

- name: Docker Hub login (optional)
  community.docker.docker_login:
    username: "{{ dockerhub_username }}"
    password: "{{ dockerhub_password }}"
  no_log: true
  when:
    - dockerhub_username | length > 0
    - dockerhub_password | length > 0
  tags:
    - app_deploy
    - compose

- name: Deploy application with Docker Compose
  block:
    - name: Create app directory
      ansible.builtin.file:
        path: "{{ compose_project_dir }}"
        state: directory
        mode: "0755"

    - name: Template docker-compose.yml
      ansible.builtin.template:
        src: docker-compose.yml.j2
        dest: "{{ compose_project_dir }}/docker-compose.yml"
        mode: "0644"

    - name: Deploy with Docker Compose v2
      community.docker.docker_compose_v2:
        project_src: "{{ compose_project_dir }}"
        state: present
        pull: always

  rescue:
    - name: Log deployment failure
      ansible.builtin.debug:
        msg: "Docker Compose deployment failed for {{ app_name }} in {{ compose_project_dir }}"

  tags:
    - app_deploy
    - compose